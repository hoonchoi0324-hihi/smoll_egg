<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>은빛마을의 진실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* Layout: one night-blue screen. HUD strip on top, 4:3 pixel stage, touch pad below. Single dark look by design. */
:root{
  --bg:#080a17; --panel:#121833; --panel2:#1b2347; --line:#36406d;
  --silver:#cfd6e6; --text:#e9edf7; --dim:#8d97bb; --gold:#f3c969; --red:#ff5d72; --blue:#5aa8ff;
  --f-title:'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Gowun Batang','Nanum Myeongjo',serif;
  --f-ui:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:var(--f-ui)}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#hud{display:flex;align-items:center;gap:8px;justify-content:space-between;font-family:var(--f-ui);font-size:15px;color:var(--dim)}
#hud .case{color:var(--silver);letter-spacing:.04em}
#hud .case b{color:var(--gold);font-weight:400}
.hbtn{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.hbtn:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#stage{position:relative;width:256px;height:192px;background:#000;box-shadow:0 0 0 2px var(--line),0 18px 40px rgba(0,0,0,.6);overflow:hidden;--u:1}
#game{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.ov{position:absolute;inset:0}
#dlg{position:absolute;left:3%;right:3%;bottom:3%;background:rgba(10,13,32,.94);border:2px solid var(--silver);border-radius:4px;
  padding:clamp(8px,calc(var(--u)*5px),16px) clamp(10px,calc(var(--u)*7px),22px);min-height:30%;cursor:pointer;box-shadow:0 0 0 3px #0a0d20}
#dlg .who{display:inline-block;font-family:var(--f-ui);font-size:clamp(13px,calc(var(--u)*6.5px),20px);padding:1px 8px;border-radius:3px;background:#0a0d20;margin-bottom:4px;letter-spacing:.03em}
#dlg .txt{font-family:var(--f-body);font-size:clamp(14px,calc(var(--u)*7px),22px);line-height:1.55;word-break:keep-all;white-space:pre-wrap}
#dlg .more{position:absolute;right:10px;bottom:6px;color:var(--gold);font-size:12px;animation:bob .8s steps(2) infinite}
#dlg{display:flex;gap:clamp(8px,calc(var(--u)*5px),18px);align-items:flex-start;background:linear-gradient(180deg,rgba(18,24,56,.96),rgba(8,10,26,.97));box-shadow:0 0 0 3px #0a0d20,inset 0 0 0 2px #2a3360,0 8px 0 rgba(0,0,0,.35)}
#dlg .face{flex:none;width:clamp(44px,calc(var(--u)*30px),104px);height:clamp(44px,calc(var(--u)*30px),104px);image-rendering:pixelated;border:2px solid var(--silver);border-radius:3px;box-shadow:0 0 0 2px #0a0d20}
#dlg .dbody{flex:1;min-width:0}
#dlg .who{border-bottom:2px solid currentColor;border-radius:3px 3px 0 0}
@keyframes bob{50%{transform:translateY(3px)}}
#loc{position:absolute;left:8px;top:8px;font-size:clamp(12px,calc(var(--u)*5.5px),17px);background:rgba(8,10,23,.7);padding:2px 8px;border-radius:3px;color:var(--silver);border-left:3px solid var(--gold)}
#toast{position:absolute;left:50%;top:12%;transform:translateX(-50%);background:var(--gold);color:#1a1405;padding:4px 12px;border-radius:3px;font-size:clamp(13px,calc(var(--u)*6px),18px);white-space:nowrap;box-shadow:0 3px 0 #8a6a1a}
.panel{position:absolute;inset:4%;background:rgba(12,16,38,.97);border:2px solid var(--silver);border-radius:6px;padding:clamp(10px,calc(var(--u)*6px),22px);overflow:auto;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:clamp(18px,calc(var(--u)*9px),30px);color:var(--silver);letter-spacing:.02em;text-wrap:balance}
.panel .sub{color:var(--dim);font-size:clamp(12px,calc(var(--u)*5.5px),17px)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.unit{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:6px;color:var(--text);padding:8px;cursor:pointer;font:inherit}
.unit:hover,.unit:focus-visible{border-color:var(--gold);outline:none}
.unit canvas{width:40px;height:56px;image-rendering:pixelated;flex:none;background:#0a0d20;border-radius:4px}
.unit b{display:block;font-size:clamp(15px,calc(var(--u)*7px),21px);font-weight:400;color:var(--gold)}
.unit span{font-size:clamp(12px,calc(var(--u)*5px),15px);color:var(--dim);line-height:1.35}
.clue{background:var(--panel2);border-radius:5px;padding:8px 10px;border-left:3px solid var(--silver);min-width:0}
.clue b{font-weight:400;color:var(--silver);font-size:clamp(14px,calc(var(--u)*6.5px),19px)}
.clue p{margin:3px 0 0;font-family:var(--f-body);font-size:clamp(13px,calc(var(--u)*5.5px),16px);color:#c4cbe0;line-height:1.45;word-break:keep-all}
.clue.miss{border-left-color:var(--line);color:var(--dim);opacity:.6}
.hint{background:#2a2410;border:1px solid #6b5a22;color:var(--gold);border-radius:5px;padding:8px 10px;font-family:var(--f-body);font-size:clamp(13px,calc(var(--u)*6px),18px);word-break:keep-all}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{font:inherit;font-size:clamp(14px,calc(var(--u)*6px),18px);background:var(--silver);color:#0b0e1c;border:0;border-radius:5px;padding:6px 16px;cursor:pointer;box-shadow:0 3px 0 #7d869e}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.opt{font:inherit;text-align:left;background:var(--panel2);color:var(--text);border:2px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;font-size:clamp(14px,calc(var(--u)*6px),18px);word-break:keep-all}
.opt:hover{border-color:var(--gold)}
.hearts{color:var(--red);letter-spacing:4px;font-size:clamp(16px,calc(var(--u)*7px),22px)}
#title{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,calc(var(--u)*4px),16px);text-align:center;background:linear-gradient(180deg,rgba(8,10,23,.2),rgba(8,10,23,.75) 70%)}
#title .kick{font-size:clamp(12px,calc(var(--u)*5.5px),18px);color:var(--gold);letter-spacing:.25em}
#title h1{margin:0;font-family:var(--f-title);font-weight:400;font-size:clamp(30px,calc(var(--u)*20px),72px);line-height:1;color:var(--silver);
  text-shadow:0 3px 0 #3a4570,0 0 24px rgba(207,214,230,.45);letter-spacing:.02em}
#title .by{font-family:var(--f-body);font-size:clamp(13px,calc(var(--u)*6px),20px);color:#c4cbe0}
#credits{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,calc(var(--u)*5px),20px);text-align:center;padding:16px}
#credits h3{margin:0;font-family:var(--f-title);font-weight:400;color:var(--silver);font-size:clamp(20px,calc(var(--u)*11px),40px)}
#credits p{margin:0;font-family:var(--f-body);color:#c4cbe0;font-size:clamp(13px,calc(var(--u)*6px),19px)}
#logo{width:clamp(70px,calc(var(--u)*40px),150px);height:auto}
#pad{display:none;width:100%;max-width:520px;justify-content:space-between;align-items:center;touch-action:none;padding-block:4px}
#pad.on{display:flex}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:2px}
.dpad button,.abtns button{font:inherit;border:0;color:var(--text);touch-action:none}
.dpad button{background:var(--panel2);border-radius:8px;font-size:20px;box-shadow:0 3px 0 #0a0d20}
.dpad button:active,.dpad button.on{background:var(--line)}
.abtns{display:grid;grid-template-columns:repeat(2,auto);gap:10px;align-items:end}
.abtns button{width:66px;height:66px;border-radius:50%;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.5)}
.abtns .a{background:var(--silver);color:#0b0e1c;transform:translateY(-22px)}
.abtns .b{background:#c0394d}
.abtns .c{grid-column:1 / span 2;width:auto;height:34px;border-radius:17px;background:var(--panel2);font-size:15px}
#keys{font-size:14px;color:var(--dim);text-align:center}
#keys kbd{font-family:var(--f-ui);background:var(--panel);border:1px solid var(--line);border-bottom-width:3px;border-radius:4px;padding:0 6px;color:var(--text)}
@media (prefers-reduced-motion:reduce){#dlg .more{animation:none}}
</style>

<div id="app">
  <div id="hud" hidden>
    <span class="case">사건 파일 No.1 · 증거 <b id="cnum">0</b>/10</span>
    <span style="display:flex;gap:6px"><button class="hbtn" id="bNote">수첩</button><button class="hbtn" id="bSnd">소리 켬</button></span>
  </div>
  <div id="stage">
    <canvas id="game" width="256" height="192"></canvas>
    <div id="loc" hidden></div>
    <div id="toast" hidden></div>
    <div id="dlg" hidden><canvas class="face" width="48" height="48"></canvas><div class="dbody"><div class="who"></div><div class="txt"></div></div><div class="more">▼</div></div>
    <div id="title" class="ov">
      <div class="kick">탐정 정진영 사건 파일</div>
      <h1>은빛마을의 진실</h1>
      <div class="by">축제 전날 밤, 사라진 은종과 은빛 유령의 발자국</div>
      <button class="btn" id="bStart">수사 시작</button>
    </div>
    <div id="menu" class="ov" hidden></div>
    <div id="credits" class="ov" hidden>
      <h3>사건 종결</h3>
      <p>탐정 정진영 · 은빛마을의 진실</p>
      <canvas id="logo" width="120" height="100"></canvas>
      <p>Created by manamiwu</p>
      <button class="btn" id="bAgain">처음부터 다시</button>
    </div>
  </div>
  <div id="pad">
    <div class="dpad">
      <span></span><button data-k="up">▲</button><span></span>
      <button data-k="left">◀</button><span></span><button data-k="right">▶</button>
      <span></span><button data-k="down">▼</button><span></span>
    </div>
    <div class="abtns">
      <button class="b" data-a="summon">소환</button>
      <button class="a" data-a="act">조사</button>
      <button class="c" data-a="note">수첩</button>
    </div>
  </div>
  <div id="keys">이동 <kbd>방향키</kbd> · 조사·대화 <kbd>E</kbd> · 경찰 소환 <kbd>Q</kbd> · 수첩 <kbd>C</kbd></div>
</div>

<script>
(()=>{
const W=256,H=192,T=16;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const dk=document.createElement('canvas');dk.width=W;dk.height=H;const dctx=dk.getContext('2d');
const $=id=>document.getElementById(id);

/* ---------- utils ---------- */
const hash=(x,y)=>{let n=(x*374761393+y*668265263)|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967295};
function shade(hex,a){const c=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(a<0?v*(1+a):v+(255-v)*a)));
  return '#'+((1<<24)|(f(c>>16)<<16)|(f((c>>8)&255)<<8)|f(c&255)).toString(16).slice(1)}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- sound ---------- */
let AC=null,sound=true;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}return AC}
function tone(f,d,type='square',v=.04,when=0){if(!sound)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;
  const t0=a.currentTime+when;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+d+.03)}catch(e){}}
const sfx={blip:()=>tone(620+Math.random()*80,.025,'square',.015),
  clue:()=>{tone(784,.12,'square',.04);tone(1046,.2,'square',.04,.11);tone(1318,.25,'triangle',.04,.22)},
  siren:()=>{for(let i=0;i<6;i++)tone(i%2?640:880,.2,'sawtooth',.025,i*.2)},
  wrong:()=>{tone(180,.18,'square',.05);tone(130,.3,'square',.05,.15)},
  right:()=>{tone(660,.1,'triangle',.05);tone(990,.18,'triangle',.05,.1)},
  bell:()=>{tone(1318,3,'sine',.12);tone(659,3.5,'sine',.08);tone(1976,1.6,'sine',.04);tone(1318,3,'sine',.1,1.4);tone(659,3.5,'sine',.07,1.4)},
  door:()=>{tone(220,.08,'square',.03);tone(160,.1,'square',.03,.07)}};

/* ---------- sprites ---------- */
const HEADS={
 short:["..........","..hhhhhh..",".hhhhhhhh.",".hssssssh.",".hsessesh.","..ssssss..","...ssss..."],
 fedora:["..HHHHHH..","..xxxxxx..","HHHHHHHHHH",".hssssssh.",".hsessesh.","..ssssss..","...ssss..."],
 chef:["..WWWWWW..",".WWWWWWWW.","..WWWWWW..",".hssssssh.",".hsessesh.","..ssssss..","...ssss..."],
 bun:["....hh....","..hhhhhh..",".hhhhhhhh.",".hssssssh.",".hsessesh.","..ssssss..","...ssss..."],
 old:["..........","..hhhhhh..",".hssssssh.",".hssssssh.",".hsessesh.","..smmmms..","...ssss..."],
 glasses:["..........","..hhhhhh..",".hhhhhhhh.",".hssssssh.",".hgeggegh.","..ssssss..","...ssss..."],
 hood:["..........","...cccc...","..cccccc..",".cssssssc.",".csessesc.","..ssssss..","...ssss..."],
 mask:["..........","...cccc...","..cccccc..",".cssssssc.",".csessesc.","..qqqqqq..","...ssss..."],
 cap:["..........","..KKKKKK..",".KKKKKKKKK",".hssssssh.",".hsessesh.","..ssssss..","...ssss..."]};
const BODIES={
 normal:["..cccccc..",".cccccccc.",".sccccccs.",".sccccccs.","..cccccc.."],
 apron:["..cccccc..",".ccaaaacc.",".scaaaacs.",".scaaaacs.","..caaaac.."],
 trench:["..cdccdc..",".cccddccc.",".sccccccs.",".scddddcs.","..cccccc.."],
 vest:["..cccccc..",".cdddddcc.",".scdddccs.",".sccccccs.","..cccccc.."],
 child:["..cccccc..",".sccccccs.","..cccccc.."]};
const LEGS={
 std:[["..pp..pp..","..pp..pp..","..bb..bb.."],["..pp..pp..","..pp...pp.","..bb...bb."]],
 trench:[["..cccccc..","..pp..pp..","..bb..bb.."],["..cccccc..","..pp...pp.","..bb...bb."]],
 dress:[["..cccccc..",".cccccccc.","..bb..bb.."],["..cccccc..",".cccccccc.","..bb..bb.."]],
 child:[["...p..p...","...b..b..."],["...p...p..","...b...b.."]]};
function polish(src){const w=src.width,h=src.height,d=src.getContext('2d').getImageData(0,0,w,h).data;
  const c=document.createElement('canvas');c.width=w+2;c.height=h+2;const g=c.getContext('2d');const id=g.createImageData(w+2,h+2),o=id.data;
  const A=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&d[(y*w+x)*4+3]>0;
  for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){const k=((y+1)*(w+2)+(x+1))*4;
    if(A(x,y)){const i=(y*w+x)*4;let f=1;if(!A(x+1,y))f=.7;else if(!A(x-1,y))f=1.2;else if(!A(x,y-1))f=1.12;else if(!A(x,y+1))f=.85;
      o[k]=d[i]*f;o[k+1]=d[i+1]*f;o[k+2]=d[i+2]*f;o[k+3]=255}
    else if(A(x-1,y)||A(x+1,y)||A(x,y-1)||A(x,y+1)){o[k]=10;o[k+1]=9;o[k+2]=22;o[k+3]=240}}
  g.putImageData(id,0,0);return c}
function makeSprite(sp){
  const head=HEADS[sp.head||'short'],body=BODIES[sp.body||(sp.child?'child':'normal')],legs=LEGS[sp.legs||(sp.child?'child':'std')];
  const col={h:sp.hair||'#222',s:sp.skin||'#efc39c',e:'#15131f',c:sp.coat,d:shade(sp.coat,-.32),p:sp.pants||'#2a2733',b:sp.boots||'#1a1720',
    H:sp.hat||'#333',x:sp.band||'#7a2b2b',W:'#f4f2ec',m:sp.hair||'#ddd',g:'#1b1b22',a:sp.apron||'#ddd4c0',K:sp.hat||'#222',q:'#a8c8ea'};
  return [0,1].map(f=>{const rows=head.concat(body,legs[f]);const c=document.createElement('canvas');c.width=10;c.height=rows.length;const g=c.getContext('2d');
    rows.forEach((r,y)=>{for(let x=0;x<10;x++){const ch=r[x];if(ch&&ch!=='.'&&col[ch]){g.fillStyle=col[ch];g.fillRect(x,y,1,1)}}});return polish(c)})}
function makeDog(){const rows=["..........b.",".........bbb","b........beb",".bbbbbbbbbbn",".bbvvvvbbbb.",".bbbbbbbbb..",".b.b....b.b.",".b.b....b.b."];
  const col={b:'#8a5a2b',e:'#111',n:'#111',v:'#2f5fb0'};
  return [0,1].map(f=>{const c=document.createElement('canvas');c.width=12;c.height=8;const g=c.getContext('2d');
    rows.forEach((r,y)=>{for(let x=0;x<12;x++){let ch=r[x];if(f&&y>=6){ch=(y===6?".b..b..b..b.":"b...b..b...b")[x]}
      if(ch&&ch!=='.'){g.fillStyle=col[ch];g.fillRect(x,y,1,1)}}});return polish(c)})}
const SPR={
 player:makeSprite({head:'fedora',hat:'#3b2a22',band:'#8a2f2f',hair:'#18151a',coat:'#b8915a',body:'trench',legs:'trench',pants:'#2a2733'}),
 doyun:makeSprite({head:'short',hair:'#5a3a22',coat:'#4f6d5e',body:'apron',apron:'#c8bfa8'}),
 haneul:makeSprite({head:'hood',coat:'#f2c230',child:true,pants:'#3a3550',boots:'#c0394d'}),
 baker:makeSprite({head:'chef',hair:'#3a2a20',coat:'#efece2',body:'apron',apron:'#d9c39a',pants:'#5a4a3a'}),
 madame:makeSprite({head:'bun',hair:'#a8322e',coat:'#6a3d8a',legs:'dress',skin:'#f3cfb0'}),
 ryu:makeSprite({head:'glasses',hair:'#2a2a2a',coat:'#6b6f7d',body:'vest',pants:'#4a4d58'}),
 chief:makeSprite({head:'old',hair:'#e6e6ea',coat:'#2f5fb0',body:'trench',legs:'trench',pants:'#2a2733'}),
 baek:makeSprite({head:'old',hair:'#e6e6ea',coat:'#7a6a55',body:'apron',apron:'#b8a888'}),
 csi:makeSprite({head:'mask',coat:'#e8edf5',body:'normal',pants:'#e8edf5',boots:'#5aa8ff'}),
 k9:makeSprite({head:'cap',hat:'#1f3a6a',hair:'#222',coat:'#1f3a6a',body:'vest',pants:'#1f2a44'}),
 swat:makeSprite({head:'cap',hat:'#15161c',hair:'#222',coat:'#2a2c36',body:'vest',pants:'#1d1e26'}),
 dog:makeDog()};

/* ---------- clues ---------- */
const CLUES={
 footprint:{n:'은가루 발자국',d:'공방 바닥의 은가루 장화 자국. 280mm, 옛 광부 장화 밑창 무늬. 이것이 "유령 발자국"의 정체다.'},
 cloth:{n:'파란 모직 천 조각',d:'공방 창문 못에 걸려 있던 남색 고급 양모 조각.'},

function bake(m){
  const c=document.createElement('canvas');c.width=m.w*T;c.height=m.h*T;const g=c.getContext('2d');
  for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++)drawTile(g,m.tiles[y*m.w+x],x*T,y*T,x,y);
  if(m===MAPS.village){
    for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++){if(m.tiles[y*m.w+x]!==1)continue;const px=x*T,py=y*T;
      if(tile(m,x,y-1)!==1){g.fillStyle='rgba(0,0,0,.3)';g.fillRect(px,py,T,2)}
      if(tile(m,x,y+1)!==1){g.fillStyle=S.morning?'#a9adbb':'#6c738c';g.fillRect(px,py+15,T,1)}
      if(tile(m,x-1,y)!==1){g.fillStyle='rgba(0,0,0,.2)';g.fillRect(px,py,1,T)}}
    m.buildings.forEach(b=>{g.fillStyle='rgba(0,0,12,.32)';g.fillRect(b.x*T+4,(b.y+b.h)*T,b.w*T,4);g.fillRect((b.x+b.w)*T,b.y*T+10,4,b.h*T-6)});

function drawFace(c,key,col){const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.fillStyle='#0a0d20';g.fillRect(0,0,48,48);
  const rg=g.createRadialGradient(24,30,4,24,30,34);rg.addColorStop(0,col+'55');rg.addColorStop(1,'#0a0d2000');g.fillStyle=rg;g.fillRect(0,0,48,48);
  for(let i=0;i<48;i+=4){g.fillStyle='rgba(255,255,255,.03)';g.fillRect(0,i,48,1)}
  if(key==='dog')g.drawImage(SPR.dog[0],0,0,14,10,3,10,42,30);else g.drawImage(SPR[key][0],0,0,12,12,0,2,48,48)}
let DQ=[],DI=0,dShown=0,dDone=null,dCb=null;
function say(lines,cb){DQ=lines;DI=0;dCb=cb||null;S.mode='dialog';$('dlg').hidden=false;showLine()}
function showLine(){const l=DQ[DI];if(typeof l==='function'){l();DI++;if(DI<DQ.length)showLine();else endDlg();return}
  const [who,txt]=l;const fc=$('dlg').querySelector('.face');const fk=FACE[who];fc.hidden=!fk;if(fk)drawFace(fc,fk,COLORS[who]||'#cfd6e6');const w=$('dlg').querySelector('.who');w.textContent=who;w.style.color=COLORS[who]||'#e9edf7';w.hidden=!who;
  dDone=txt;dShown=0;$('dlg').querySelector('.txt').textContent='';$('dlg').querySelector('.more').hidden=true}
function advance(){if(S.mode!=='dialog')return;if(dShown<dDone.length){dShown=dDone.length;$('dlg').querySelector('.txt').textContent=dDone;$('dlg').querySelector('.more').hidden=false;return}
  DI++;if(DI<DQ.length)showLine();else endDlg()}
function endDlg(){$('dlg').hidden=true;S.mode='play';const cb=dCb;dCb=null;if(cb)cb()}
function typeTick(){if(S.mode!=='dialog'||dDone==null||dShown>=dDone.length)return;dShown=Math.min(dDone.length,dShown+1.6);
  $('dlg').querySelector('.txt').textContent=dDone.slice(0,Math.floor(dShown));if(Math.floor(dShown)%3===0)sfx.blip();
  if(dShown>=dDone.length)$('dlg').querySelector('.more').hidden=false}

function interact(){const c=nearest();if(!c)return;
  if(c.npc)TALK[c.id]();else if(ACT[c.id])ACT[c.id]()}
function nearest(){const m=S.map;let best=null,bd=1e9;const px=P.x,py=P.y-4;
  m.npcs.forEach(n=>{if(S.morning)return;const d=Math.hypot(n.x-px,(n.y-6)-py);if(d<20&&d<bd){bd=d;best={id:n.id,npc:1,x:n.x,y:n.y-20}}});
  m.spots.forEach(s=>{if(s.id==='bellSpot'&&(!S.f.rubble||has('bell')))return;const d=Math.hypot(s.x-px,s.y-py);if(d<s.r&&d<bd){bd=d;best={id:s.id,x:s.x,y:s.y-14}}});
  return best}

function doSummon(u){closeMenu();S.siren=70;sfx.siren();const un=UNIT[u];
  S.unit={u,x:P.x+(P.x>S.map.w*T-30?-16:16),y:P.y,drop:30};
  const c=nearest();const fn=c&&SUM[c.id]&&SUM[c.id][u];
  setTimeout(()=>{const intro=[[un.lead,un.name+' 출동! 정진영 탐정님, 무엇을 도와드릴까요?']];
    if(fn){say(intro,()=>{fn();const _cb=dCb;dCb=()=>{S.unit=null;if(_cb)_cb()};if(S.mode!=='dialog'){S.unit=null}})}
    else say(intro.concat(DEF[u]),()=>{S.unit=null})},650)}

function startAccuse(){QI=0;S.hearts=3;say([['나레이션','시계탑 광장. 마을 사람들이 모여들었다.'],['정진영','지금부터 은빛 유령의 정체를 밝히겠습니다.']],showQ)}
function showQ(){S.mode='menu';const q=QS[QI],m=$('menu');m.hidden=false;
  const opts=q.type==='suspect'?q.opts:[...S.clues].map(k=>[k,CLUES[k].n]);
  m.innerHTML=`<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="sub">추리 ${QI+1} / ${QS.length}</span><span class="hearts">${'♥'.repeat(S.hearts)}<span style="color:#3a4570">${'♥'.repeat(3-S.hearts)}</span></span></div><h2>${q.q}</h2><div class="opts" id="qopts"></div></div>`;
  opts.forEach(([k,label])=>{const b=document.createElement('button');b.className='opt';b.textContent=label;b.onclick=()=>pick(k);$('qopts').append(b)});
  setTimeout(()=>{const f=m.querySelector('.opt');f&&f.focus()},0)}
function pick(k){const q=QS[QI];$('menu').hidden=true;$('menu').innerHTML='';
  if(k===q.ans){sfx.right();QI++;say(q.after,()=>{if(QI<QS.length)showQ();else confess()});return}
  sfx.wrong();S.hearts--;S.shake=12;const msg=(q.wrong&&q.wrong[k])||'…아니, 이 증거로는 설명이 안 돼.';
  if(S.hearts<=0)return say([['정진영',msg],['마을 사람들','(웅성웅성) 탐정도 별수 없구먼…'],['정진영','…다시 증거를 정리하자. 수첩을 확인해 보자.']]);
  say([['정진영',msg],['정진영','다시 생각해 보자.']],showQ)}

function credits(){S.mode='credits';$('credits').hidden=false;drawLogo()}
function drawLogo(){const c=$('logo'),g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,120,100);g.fillStyle='#fff';
  const sx=18,sw=42,sh=36,gap=4,d=38;const top=(100-(d+gap+sh))/2;
  g.beginPath();g.arc(sx+sw/2,top+d/2,d/2,0,Math.PI*2);g.fill();g.fillRect(sx,top+d+gap,sw,sh);
  const tx=sx+sw+gap,tb=top+d+gap+sh;g.beginPath();g.moveTo(tx,top);g.lineTo(tx,tb);g.lineTo(tx+44,tb);g.closePath();g.fill()}

/* ---------- movement ---------- */
function solidAt(px,py){const m=S.map,tx=Math.floor(px/T),ty=Math.floor(py/T);if(tx<0||ty<0||tx>=m.w||ty>=m.h)return true;
  if(SOLID_TILE[m.tiles[ty*m.w+tx]])return true;if(m.block[ty*m.w+tx])return true;
  for(const n of m.npcs){if(Math.abs(n.x-px)<6&&Math.abs(n.y-py)<4)return true}return false}
function canStand(x,y){return!(solidAt(x-4,y-3)||solidAt(x+4,y-3)||solidAt(x-4,y+1)||solidAt(x+4,y+1))}
function update(){S.t++;
  if(toastT>0&&--toastT===0)$('toast').hidden=true;if(locT>0&&--locT===0)$('loc').hidden=true;
  if(S.fade>0)S.fade=Math.max(0,S.fade-.04);if(S.siren>0)S.siren--;if(S.flash>0)S.flash--;if(S.shake>0)S.shake--;
  if(S.unit&&S.unit.drop>0)S.unit.drop-=3;
  typeTick();
  if(S.mode==='title'){S.cam.x=(Math.sin(S.t/600)*.5+.5)*(MAPS.village.w*T-W);S.cam.y=60+Math.sin(S.t/450)*40;return}
  P.moving=false;
  if(S.mode==='play'){let dx=0,dy=0;if(keys.left)dx--;if(keys.right)dx++;if(keys.up)dy--;if(keys.down)dy++;
    if(dx||dy){const sp=1.25/(dx&&dy?1.414:1);if(canStand(P.x+dx*sp,P.y))P.x+=dx*sp;if(canStand(P.x,P.y+dy*sp))P.y+=dy*sp;P.moving=true;P.walk++;}}
  P.frame=P.moving?((P.walk>>3)&1):0;
  const m=S.map,mw=m.w*T,mh=m.h*T;
  S.cam.x=mw<=W?(mw-W)/2:clamp(P.x-W/2,0,mw-W);S.cam.y=mh<=H?(mh-H)/2:clamp(P.y-8-H/2,0,mh-H);
  if(S.mode==='play'&&!S.f.shopVisited&&m===MAPS.shop){S.f.shopVisited=1;setTimeout(()=>say([['나레이션','백노인 은세공 공방. 은 냄새와 차가운 밤공기가 뒤섞여 있다.'],['정진영','창문이 열려 있고, 바닥이 반짝인다. 하나씩 보자.']]),300)}}

/* ---------- render ---------- */
const motes=Array.from({length:40},(_,i)=>({x:hash(i,1)*576,y:hash(i,2)*416,s:hash(i,3)*.3+.1,p:hash(i,4)*6}));
function drawSpr(sp,x,y,f,bob=0){const c=sp[f];ctx.fillStyle='rgba(0,0,10,.4)';ctx.fillRect(Math.round(x-4),Math.round(y-1),8,3);ctx.fillRect(Math.round(x-5),Math.round(y),10,1);ctx.drawImage(c,Math.round(x-c.width/2),Math.round(y-c.height+2+bob))}
function render(){const m=S.title?MAPS.village:S.map||MAPS.village;
  let cx=Math.round(S.cam.x),cy=Math.round(S.cam.y);if(S.shake){cx+=((Math.random()*4)|0)-2;cy+=((Math.random()*4)|0)-2}
  ctx.fillStyle='#04050b';ctx.fillRect(0,0,W,H);
  if(!m.layer)bake(m);ctx.drawImage(m.layer,-cx,-cy);
  // trail
  if(m===MAPS.village&&has('trail')&&!S.morning){const lines=[[[6,9],[6,13],[23,13],[23,21],[32,21],[32,20]],[[6,13],[14,13],[14,3]]];
    lines.forEach(L=>{let k=0;for(let i=0;i<L.length-1;i++){const[a,b]=[L[i],L[i+1]];const ax=a[0]*T+8,ay=a[1]*T+8,bx=b[0]*T+8,by=b[1]*T+8,len=Math.hypot(bx-ax,by-ay);
      for(let s=0;s<len;s+=7){k++;const tw=(Math.sin(S.t/12+k*.7)+1)/2;ctx.fillStyle=`rgba(225,232,248,${.35+tw*.55})`;ctx.fillRect(Math.round(ax+(bx-ax)*s/len-cx),Math.round(ay+(by-ay)*s/len-cy),2,2)}}})}
  // shop footprints
  if(m===MAPS.shop){const pts=[[150,40],[140,52],[130,62],[118,70],[104,62],[96,52],[110,82],[126,92],[140,86],[150,74]];
    pts.forEach(([x,y],i)=>{const tw=(Math.sin(S.t/10+i)+1)/2;ctx.fillStyle=has('footprint')?`rgba(230,236,250,${.6+tw*.4})`:`rgba(220,228,245,${tw*.25})`;
      ctx.fillRect(x-cx,y-cy,3,has('footprint')?5:2);if(has('footprint')){ctx.fillRect(x-cx,y-cy+6,3,2)}})}
  // mine rubble & bell
  if(m===MAPS.mine){if(!S.f.rubble){for(let i=0;i<14;i++){const a=hash(i,9),b=hash(9,i);ctx.fillStyle=i%3?'#4a4a5a':'#5e5e70';ctx.fillRect(6*T+a*26-cx,3*T+b*12-cy,8,6)}}
    if(S.f.rubble&&!has('bell')){const bx=7*T-cx,by=1*T+6-cy;ctx.fillStyle='#8a7a5a';ctx.fillRect(bx-7,by,14,12);ctx.fillStyle='#d9dfec';ctx.fillRect(bx-4,by-4,8,6);ctx.fillStyle='#fff';ctx.fillRect(bx-2,by-3,2,3);
      if(S.t%40<20){ctx.fillStyle='#fff';ctx.fillRect(bx+5,by-6,1,3);ctx.fillRect(bx+4,by-5,3,1)}}}
  // characters
  const list=[];m.npcs.forEach(n=>list.push({y:n.y,d:()=>drawSpr(SPR[n.spr],n.x-cx,n.y-cy,0,(Math.floor(S.t/30+n.x)%2))}));
  if(S.mode!=='title')list.push({y:P.y,d:()=>drawSpr(SPR.player,P.x-cx,P.y-cy,P.frame)});
  if(S.unit){const u=S.unit,dr=Math.max(0,u.drop);list.push({y:u.y,d:()=>{drawSpr(SPR[UNIT[u.u].spr],u.x-cx,u.y-cy-dr,0);if(u.u==='k9')ctx.drawImage(SPR.dog[(S.t>>3)&1],Math.round(u.x-cx+3),Math.round(u.y-cy-7-dr))}})}
  list.sort((a,b)=>a.y-b.y).forEach(o=>o.d());
  if(m===MAPS.village){
    // chimney smoke
    m.buildings.forEach(b=>{if(!['shop','inn','bakery','house2'].includes(b.id))return;const sx=b.x*T+b.w*T-11,sy=b.y*T-8;
      for(let k=0;k<6;k++){const ph=((S.t*.35+k*11)%66),a=(1-ph/66)*.35,r=2+ph/14;const x=sx+Math.sin((S.t+k*40)/30)*ph/10+ph/8-cx,y=sy-ph-cy;
        ctx.fillStyle=`rgba(200,206,224,${a})`;ctx.fillRect(Math.round(x-r),Math.round(y-r),Math.round(r*2),Math.round(r*2))}});
    // pond shimmer
    [[30,23],[31,23],[30,24],[31,24],[29,24]].forEach(([x,y],i)=>{const o=(S.t/6+i*5)%14;ctx.fillStyle=S.morning?'rgba(255,255,255,.5)':'rgba(200,215,255,.45)';ctx.fillRect(Math.round(x*T+o-cx),Math.round(y*T+5+(i%2)*5-cy),3,1)});
    // festival bunting
    const cols=['#cfd6e6','#c0394d','#5aa8ff','#f3c969'];
    [[12*T+8,10*T-9,22*T+8,10*T-9],[24*T+8,12*T-9,33*T+8,12*T-9],[5*T+8,12*T-9,10*T+8,12*T-9]].forEach(([x1,y1,x2,y2],bi)=>{const n=Math.floor((x2-x1)/7);
      for(let i=0;i<=n;i++){const t=i/n,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t+Math.sin(t*Math.PI)*10;ctx.fillStyle='#1a1622';ctx.fillRect(Math.round(x-cx),Math.round(y-cy),7,1);
        if(i<n){const sw=Math.sin(S.t/20+i)*.8;ctx.fillStyle=cols[(i+bi)%4];const fx=Math.round(x-cx+1+sw),fy=Math.round(y-cy+1);ctx.fillRect(fx,fy,5,2);ctx.fillRect(fx+1,fy+2,3,2);ctx.fillRect(fx+2,fy+4,1,1)}}});
    // drifting fog
    if(!S.morning)for(let i=0;i<3;i++){const fx=((S.t*.15+i*230)%(m.w*T+200))-100-cx,fy=120+i*110-cy;const fg=ctx.createRadialGradient(fx,fy,0,fx,fy,90);fg.addColorStop(0,'rgba(190,200,235,.11)');fg.addColorStop(1,'rgba(190,200,235,0)');ctx.fillStyle=fg;ctx.fillRect(fx-90,fy-45,180,90)}}
  // motes
  if(m===MAPS.village){motes.forEach(p=>{p.y-=p.s;p.x+=Math.sin(S.t/60+p.p)*.15;if(p.y<0)p.y=416;const a=(Math.sin(S.t/30+p.p)+1)/2;
    ctx.fillStyle=S.morning?`rgba(255,250,220,${a*.5})`:`rgba(220,228,248,${a*.7})`;ctx.fillRect(Math.round(p.x-cx),Math.round(p.y-cy),1,1)})}
  // darkness
  const dark=S.mode==='title'?.6:m.dark;
  if(dark>.01){dctx.globalCompositeOperation='source-over';dctx.clearRect(0,0,W,H);if(S.morning){dctx.fillStyle=`rgba(255,200,140,${dark})`}else{const lg=dctx.createLinearGradient(0,0,W*.6,H);lg.addColorStop(0,`rgba(24,32,74,${dark-.12})`);lg.addColorStop(1,`rgba(4,5,18,${Math.min(.96,dark+.06)})`);dctx.fillStyle=lg}dctx.fillRect(0,0,W,H);
    if(!S.morning){dctx.globalCompositeOperation='destination-out';
      const hole=(x,y,r,s=1)=>{const g=dctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(0,0,0,${s})`);g.addColorStop(.55,`rgba(0,0,0,${s*.7})`);g.addColorStop(1,'rgba(0,0,0,0)');dctx.fillStyle=g;dctx.beginPath();dctx.arc(x,y,r,0,7);dctx.fill()};
      m.lights.forEach(l=>hole(l.x-cx,l.y-cy,l.r*(l.lamp?1+Math.sin(S.t/9+l.x)*.04:1)));if(S.mode!=='title')hole(P.x-cx,P.y-8-cy,m.plr);
      if(S.unit)hole(S.unit.x-cx,S.unit.y-8-cy,30)}
    ctx.drawImage(dk,0,0);
    if(!S.morning){ctx.globalCompositeOperation='lighter';m.lights.forEach(l=>{const x=l.x-cx,y=l.y-cy+(l.lamp||l.warm?0:10);if(x<-40||x>W+40||y<-40||y>H+40)return;
      const g=ctx.createRadialGradient(x,y,0,x,y,l.r*.7);g.addColorStop(0,l.warm?'rgba(255,120,50,.22)':l.lamp?'rgba(243,201,105,.2)':'rgba(243,190,100,.13)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(x-l.r,y-l.r,l.r*2,l.r*2)});
      ctx.globalCompositeOperation='source-over'}}
  // moon (title)
  if(S.mode==='title'){ctx.fillStyle='#e8edf7';ctx.beginPath();ctx.arc(210,30,14,0,7);ctx.fill();ctx.fillStyle='#cfd6e6';ctx.fillRect(203,26,4,3);ctx.fillRect(214,34,3,2)}
  if(S.mode!=='title'){const vg=ctx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.9);vg.addColorStop(0,'rgba(0,0,10,0)');vg.addColorStop(1,S.morning?'rgba(40,20,0,.25)':'rgba(0,0,10,.5)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H)}
  // indicator
  if(S.mode==='play'){const c=nearest();if(c){const x=Math.round(c.x-cx),y=Math.round(c.y-cy+Math.sin(S.t/8)*1.5)-4;ctx.fillStyle='#0b0a16';ctx.fillRect(x-6,y-6,13,11);ctx.fillRect(x-1,y+5,3,2);ctx.fillStyle=c.npc?'#f4f2ec':'#f3c969';ctx.fillRect(x-5,y-5,11,9);ctx.fillRect(x,y+4,1,2);ctx.fillStyle='#0b0a16';
    if(c.npc){ctx.fillRect(x-3,y-1,2,2);ctx.fillRect(x,y-1,2,2);ctx.fillRect(x+3,y-1,2,2)}else{ctx.fillRect(x,y-4,2,5);ctx.fillRect(x,y+2,2,1)}}}
  // effects
  if(S.siren>0){const on=(S.siren>>3)&1;const g=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.85);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,on?'rgba(255,60,80,.55)':'rgba(70,140,255,.55)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  if(S.flash>0){ctx.fillStyle=`rgba(170,210,255,${S.flash/24*.6})`;ctx.fillRect(0,0,W,H)}
  if(S.fade>0){ctx.fillStyle=`rgba(0,0,0,${Math.min(1,S.fade*1.4)})`;ctx.fillRect(0,0,W,H)}}

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function loop(now){acc+=Math.min(100,now-last);last=now;while(acc>=16.67){update();acc-=16.67}render();requestAnimationFrame(loop)}

/* ---------- input ---------- */
const KMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
function action(a){ac();
  if(S.mode==='dialog'){if(a==='act')advance();return}
  if(S.mode==='menu'){if(a==='note'||a==='summon'||a==='esc'){if(!$('menu').querySelector('#mClose'))return;closeMenu()}return}
  if(S.mode!=='play')return;if(a==='act')interact();if(a==='summon')openSummon();if(a==='note')openNote()}
addEventListener('keydown',e=>{if(KMAP[e.code]){keys[KMAP[e.code]]=1;e.preventDefault()}
  if(e.repeat)return;
  if(['KeyE','Space','Enter'].includes(e.code)){if(S.mode==='menu'||S.mode==='title'||S.mode==='credits')return;e.preventDefault();action('act')}
  if(e.code==='KeyQ')action('summon');if(e.code==='KeyC')action('note');if(e.code==='Escape')action('esc')});
addEventListener('keyup',e=>{if(KMAP[e.code])keys[KMAP[e.code]]=0});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();keys[k]=1;b.classList.add('on')},off=e=>{keys[k]=0;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off)});
document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();action(b.dataset.a)}));
$('dlg').addEventListener('click',()=>advance());
$('bNote').onclick=()=>action('note');
$('bSnd').onclick=()=>{sound=!sound;$('bSnd').textContent=sound?'소리 켬':'소리 끔'};
$('bStart').onclick=()=>{ac();$('title').hidden=true;$('hud').hidden=false;S.mode='play';S.map=MAPS.village;P.x=17*T+8;P.y=23*T+8;fit();
  say([['나레이션','축제 전날 밤, 은빛마을.'],['나레이션','마을의 보물 "은종"이 사라지고, 은세공 장인 백노인이 공방에서 쓰러진 채 발견되었다.'],
   ['나레이션','공방 바닥엔 은빛으로 빛나는 발자국. 마을 사람들은 옛 은광의 "은빛 유령"이 돌아왔다고 수군댄다.'],
   ['정진영','유령이라… 유령은 발자국을 남기지 않지.'],['정진영','이 사건, 탐정 정진영이 맡겠습니다.'],
   ['시스템',(isTouch()?'왼쪽 버튼으로 이동, [조사]로 대화·조사, [소환]으로 과학수사대·경찰견팀·강력반을 부를 수 있어요. 막히면 [수첩]을 보세요.':'방향키로 이동, E로 대화·조사, Q로 과학수사대·경찰견팀·강력반 소환, C로 수첩. 막히면 수첩을 보세요.')]],
   ()=>showLoc('은빛마을'))};
$('bAgain').onclick=()=>location.reload();

/* ---------- layout ---------- */
const isTouch=()=>matchMedia('(pointer:coarse)').matches||innerWidth<700;
function fit(){const pad=$('pad'),touch=isTouch();pad.classList.toggle('on',touch);$('keys').hidden=touch;
  const app=$('app');const avW=app.clientWidth;const padH=touch?pad.offsetHeight:$('keys').offsetHeight;const hudH=$('hud').hidden?0:$('hud').offsetHeight;
  const avH=innerHeight-padH-hudH-36;const s=Math.max(.5,Math.min(avW/W,avH/H));
  const st=$('stage');st.style.width=Math.floor(W*s)+'px';st.style.height=Math.floor(H*s)+'px';st.style.setProperty('--u',s.toFixed(3));$('hud').style.width=Math.floor(W*s)+'px'}
addEventListener('resize',fit);fit();
bake(MAPS.village);requestAnimationFrame(loop);
})();
</script>
